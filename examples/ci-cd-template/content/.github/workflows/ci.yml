name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ values.language == 'nodejs' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        if: ${{ values.language == 'python' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Go
        if: ${{ values.language == 'go' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install dependencies (Node.js)
        if: ${{ values.language == 'nodejs' }}
        run: npm ci

      - name: Install dependencies (Python)
        if: ${{ values.language == 'python' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || echo "No requirements.txt found"

      - name: Install dependencies (Go)
        if: ${{ values.language == 'go' }}
        run: go mod download

      - name: Run tests (Node.js)
        if: ${{ values.language == 'nodejs' }}
        run: npm test

      - name: Run tests (Python)
        if: ${{ values.language == 'python' }}
        run: python -m pytest 2>/dev/null || echo "No tests configured"

      - name: Run tests (Go)
        if: ${{ values.language == 'go' }}
        run: go test -v ./...

      - name: Build
        run: echo "Build step - customize for ${{ values.language }}"

  ${{ values.enableDocker == true && 'docker:' || '' }}:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ values.name }}:${{ github.sha }}

  ${{ values.enableKubernetes == true && 'deploy:' || '' }}:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f kubernetes/
          kubectl rollout status deployment/${{ values.name }} -n default
